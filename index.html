function cn(f,t0,d,ty,v,sl,m){const c=ac();if(!c)return;const t=c.currentTime+.015+t0,o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f*m,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl*m,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.min(.4,v*1.7),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.025)}
